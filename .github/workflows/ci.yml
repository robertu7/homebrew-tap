name: Validate casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chameo:
    runs-on: macos-26
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Tap checkout
        run: brew tap robertu7/tap "$GITHUB_WORKSPACE"

      - name: Check style
        run: brew style Casks/chameo.rb

      - name: Test installation
        run: |
          brew install --cask --appdir="$RUNNER_TEMP/Applications" robertu7/tap/chameo
          bundle="$RUNNER_TEMP/Applications/Chameo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")" = com.robertu.Chameo
          codesign --verify --deep --strict "$bundle"
          attributes="$(/usr/bin/xattr -rs "$bundle")"
          if grep -q ': com\.apple\.quarantine$' <<< "$attributes"; then
            echo "Chameo.app still has a quarantine attribute after installation." >&2
            exit 1
          fi

      - name: Test first launch
        timeout-minutes: 1
        run: |
          trap '/usr/bin/pkill -x Chameo || true' EXIT
          /usr/bin/open -g "$RUNNER_TEMP/Applications/Chameo.app"
          for attempt in {1..10}; do
            if /usr/bin/pgrep -x Chameo; then
              exit 0
            fi
            sleep 1
          done
          echo "Chameo did not start after installation." >&2
          exit 1

      - name: Audit cask
        run: brew audit --cask --online robertu7/tap/chameo
