name: Validate casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chameo:
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Tap checkout
        run: |
          brew tap robertu7/tap "$GITHUB_WORKSPACE"
          brew trust --cask robertu7/tap/chameo

      - name: Audit cask
        run: |
          brew style Casks/chameo.rb
          brew audit --cask --online robertu7/tap/chameo

      - name: Test installation
        run: |
          brew install --cask --appdir="$RUNNER_TEMP/Applications" robertu7/tap/chameo
          bundle="$RUNNER_TEMP/Applications/Chameo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")" = com.robertu.Chameo
          codesign --verify --deep --strict "$bundle"
